spring.application.name=ai-aggregator-service
server.port=8083
spring.profiles.active=dev

# ── Local LLM (Spring AI + Ollama) ──────────────────────────────────────────────
spring.ai.ollama.chat.options.model=llama3.1:8b
spring.ai.ollama.chat.options.temperature=0.2
# Never auto-pull at startup; the model is provisioned out-of-band (ollama pull ...).
spring.ai.ollama.init.pull-model-strategy=never
# Sensible default; overridden per profile.
spring.ai.ollama.base-url=http://localhost:11434

# ── Downstream service discovery (profile-driven base URL) ──────────────────────
restaurant-service.base-url=http://localhost:8082

# ── HTTP client timeouts (shared RestClient.Builder settings) ───────────────────
# A stopped Ollama fails fast (connect refused); a slow one trips the read timeout.
spring.http.client.connect-timeout=2s
spring.http.client.read-timeout=20s

# ── Resilience4j circuit breaker around the LLM call ────────────────────────────
resilience4j.circuitbreaker.instances.ollama.sliding-window-size=10
resilience4j.circuitbreaker.instances.ollama.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.ollama.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ollama.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.ollama.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.ollama.register-health-indicator=true

# ── Actuator / Prometheus ───────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.health.circuitbreakers.enabled=true
management.metrics.tags.application=ai-aggregator-service
