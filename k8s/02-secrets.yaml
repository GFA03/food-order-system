# Secrets (req II.1). The document mentions "AI API keys" but this project uses a local
# Ollama (no external key), so the real secrets are the JWT signing key (shared by
# identity-service which signs and gateway-service which validates) and the DB password.
# Demo values — override in any real environment.
apiVersion: v1
kind: Secret
metadata:
  name: omnieats-secrets
  namespace: omnieats
type: Opaque
stringData:
  JWT_SECRET: "omnieats-dev-secret-key-change-in-production"
  SPRING_DATASOURCE_PASSWORD: "rootpassword"
  POSTGRES_PASSWORD: "rootpassword"
