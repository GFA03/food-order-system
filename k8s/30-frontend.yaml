apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: omnieats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # nginx serving the built SPA. NOTE: the production build calls the API at
          # http://localhost:8080, so reach the gateway via `kubectl port-forward` on 8080.
          image: docker-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: omnieats
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
