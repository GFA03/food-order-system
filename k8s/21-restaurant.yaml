# Load balancing (req II.3): 3 replicas behind one ClusterIP Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-service
  namespace: omnieats
spec:
  replicas: 3
  selector:
    matchLabels:
      app: restaurant-service
  template:
    metadata:
      labels:
        app: restaurant-service
    spec:
      containers:
        - name: restaurant-service
          image: docker-restaurant-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: omnieats-config
            - secretRef:
                name: omnieats-secrets
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: omnieats-config
                  key: RESTAURANT_DATASOURCE_URL
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: restaurant-service
  namespace: omnieats
spec:
  selector:
    app: restaurant-service
  ports:
    - port: 8082
      targetPort: 8082
