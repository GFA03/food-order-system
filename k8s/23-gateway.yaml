apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: omnieats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: docker-gateway-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # JWT_SECRET (from Secret) must match identity-service; routes resolve sibling
          # Services via K8s DNS (application-docker.yml already uses those names).
          envFrom:
            - configMapRef:
                name: omnieats-config
            - secretRef:
                name: omnieats-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 75
            periodSeconds: 15
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: omnieats
spec:
  selector:
    app: gateway-service
  ports:
    - port: 8080
      targetPort: 8080
