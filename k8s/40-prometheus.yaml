apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: omnieats
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'gateway-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['gateway-service:8080']

      - job_name: 'identity-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['identity-service:8081']

      - job_name: 'restaurant-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['restaurant-service:8082']

      - job_name: 'ai-aggregator-service'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['ai-aggregator-service:8083']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: omnieats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - --config.file=/etc/prometheus/prometheus.yml
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: omnieats
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
