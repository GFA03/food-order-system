apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: omnieats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
        - name: identity-service
          image: docker-identity-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: omnieats-config
            - secretRef:
                name: omnieats-secrets
          env:
            # Per-service DB URL (the shared ConfigMap holds both; pick this one).
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: omnieats-config
                  key: IDENTITY_DATASOURCE_URL
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: omnieats
spec:
  selector:
    app: identity-service
  ports:
    - port: 8081
      targetPort: 8081
