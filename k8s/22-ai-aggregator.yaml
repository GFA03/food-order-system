apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-aggregator-service
  namespace: omnieats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-aggregator-service
  template:
    metadata:
      labels:
        app: ai-aggregator-service
    spec:
      containers:
        - name: ai-aggregator-service
          image: docker-ai-aggregator-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          # No datasource (no DB). Redis + Ollama URLs come from the ConfigMap.
          envFrom:
            - configMapRef:
                name: omnieats-config
            - secretRef:
                name: omnieats-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 75
            periodSeconds: 15
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: ai-aggregator-service
  namespace: omnieats
spec:
  selector:
    app: ai-aggregator-service
  ports:
    - port: 8083
      targetPort: 8083
